services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextcraft
      POSTGRES_PASSWORD: contextcraft
      POSTGRES_DB: contextcraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextcraft -d contextcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://contextcraft:contextcraft@db:5432/contextcraft
      OPENROUTER_SITE_URL: http://localhost:5000
    volumes:
      - uploads_data:/app/uploads
      - storage_data:/app/storage

volumes:
  postgres_data:
  uploads_data:
  storage_data:
